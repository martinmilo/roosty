# sanity rust @ rust-v0.1.0
# cargo-deny: advisories, licenses, duplicate versions and sources.
# Adjust before the first run: the license allowlist and the sources below are a starting
# point, not a policy decision made for you.

[graph]
all-features = true
# bin/build turns the Linux host into its musl triple; these are the hosts it is built on.
# Add every new release target here, or cargo-deny stops checking its dependencies.
targets = [
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Adjust before first run: the licenses your project accepts, by SPDX id.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "warn"     # the list is trimmed to what the tree uses

[licenses.private]
ignore = true                       # workspace crates with publish = false need no license field

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true         # a path dependency inside the workspace has no version

[sources]
# Adjust before first run: the registries and Git hosts you accept dependencies from.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
